<!DOCTYPE html>
<html>

<head>
    <title>Border Radius</title>

    <style>
        .box1 {
            background-color: lightgreen;
            width: 300px;
            height: 120px;
            padding: 15px;
            border-radius: 20px;
        }
        
        .box2 {
            width: 300px;
            height: 200px;
            background-image: url("../img/photo.jpg");
            background-size: cover;
            border-radius: 20px;
        }
    </style>

</head>

<body>

    <h3>a) Rounded corners with background color</h3>
    <p class="box1">
        This paragraph has rounded corners with background color, padding, width and height.
    </p>

    <h3>b) Rounded corners with background image</h3>
    <div class="box2"></div>

    <br><br>
    <a href="index.html">Back</a>

</body>

</html>
