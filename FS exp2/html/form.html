<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: lightblue
        }
        
        table {
            border: 2px solid black;
            background-color: lightyellow;
            padding: 15px;
        }
        
        td {
            padding: 10px;
        }
    </style>
</head>

<body>

    <h3>Symposium Registration Form</h3>

    <form>
        <table>
            <tr>
                <td>Full Name</td>
                <td><input type="text" name="name"></td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input type="email" name="email"></td>
            </tr>

            <tr>
                <td>Phone No</td>
                <td><input type="text" name="phone"></td>
            </tr>

            <tr>
                <td>College Name</td>
                <td><input type="text" name="clg"></td>
            </tr>

            <tr>
                <td>Event Preference</td>
                <td>
                    <input type="radio" name="eve"> Technical
                    <input type="radio" name="eve"> Non-Technical
                    <input type="radio" name="eve"> Mini Games
                </td>
            </tr>

            <tr>
                <td>Date</td>
                <td><input type="date" name="date"></td>
            </tr>

            <tr>
                <td></td>
                <td><input type="submit" value="Register"></td>
            </tr>
        </table>
    </form>

    <br>
    <a href="index.html">Back</a>

</body>

</html>
