<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            justify-content: center;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        h3 {
            font-size: 1.1rem;
            color: #007bff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        ul, ol {
            padding-left: 20px;
            margin: 0;
        }
        li {
            margin-bottom: 8px;
            color: #444;
        }
    </style>
</head>
<body>
        <h2>Area of Interest</h2>
                <h3>Coding Skills</h3>
                <ol>
                    <li>C</li>
                    <li>C++</li>
                    <li>Java</li>
                    <li>Python</li>
                </ol>
                <h3>Soft Skills</h3>
                <ul>
                    <li>Leadership</li>
                    <li>Teamwork</li>
                    <li>Shuttler</li>
                    <li>Problem Solving</li>
                </ul>
</body>
</html>
