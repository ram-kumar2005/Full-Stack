<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6; 
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
        .name {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px 0 5px;
            color: #333;
        }
        .title {
            color: #007bff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .objective {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>
        <img src="quotes.png" alt="quotes">
        <p>
        <div class="name">R Ramkumar</div>
        </p>
        <p>
        <div class="title">Prefinal year AI & DS(UG) </div>
        </p>
        <p class="objective">
           "Love to learn something new and doing stuffs in Fullstack."
        </p>
</body>
</html>
