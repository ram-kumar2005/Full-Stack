<!DOCTYPE html>
<html>
<head>
    <title>World Continents Image Map</title>
</head>
<body>

<h2>World Map – Click a Continent</h2>

<img src="map.jpg" usemap="#worldmap" width="1500" height="750" alt="World Map">

<map name="worldmap">

    <!-- North America -->
    <area shape="rect"
          coords="70,110,420,360"
          href="north_america.html"
          alt="North America">

    <!-- South America -->
    <area shape="rect"
          coords="350,360,580,650"
          href="south_america.html"
          alt="South America">

    <!-- Europe -->
    <area shape="rect"
          coords="620,110,780,260"
          href="europe.html"
          alt="Europe">

    <!-- Africa -->
    <area shape="rect"
          coords="640,260,840,560"
          href="africa.html"
          alt="Africa">

    <!-- Asia -->
    <area shape="rect"
          coords="780,90,1200,420"
          href="asia.html"
          alt="Asia">

    <!-- Australia -->
    <area shape="rect"
          coords="1100,420,1400,650"
          href="australia.html"
          alt="Australia">

    <!-- Antarctica -->
    <area shape="rect"
          coords="0,630,1500,750"
          href="antarctica.html"
          alt="Antarctica">

</map>

</body>
</html>
